  }

  function isInsideBlockquoteLine(source, matchIndex, matchBody) {
    const lineStart = source.lastIndexOf('\n', matchIndex - 1) + 1;
    const linePrefix = source.slice(lineStart, matchIndex);
    return /^\s*>/.test(linePrefix) || /\n\s*>/.test(matchBody);
  }

  function extractTopLevelDisplayMath(text, mathBlocks) {
    const tickMasks = [];
    const maskedTicks = text.replace(/`[^`\n]+`/g, m => {
      const idx = tickMasks.length;
      tickMasks.push(m);
      return `\u0000INLINE_TICK_${idx}\u0000`;
    });
    const storeDisplay = (fullMatch, tex, offset, fullStr) => {
      if (isInsideBlockquoteLine(fullStr, offset, fullMatch)) return fullMatch;
      const idx = mathBlocks.length;
      mathBlocks.push(renderLatexToMathMl(tex, true));
      return `\n\u0000MATH_BLOCK_${idx}\u0000\n`;
    };
    const withMath = maskedTicks
      .replace(/\$\$([\s\S]+?)\$\$/g, storeDisplay)
      .replace(/\\\[([\s\S]+?)\\\]/g, storeDisplay);
    return withMath.replace(/\u0000INLINE_TICK_(\d+)\u0000/g, (_, idx) => tickMasks[Number(idx)] || '');
  }

  // Blockquote bodies re-enter renderMarkdownSafe with the current fold depth so a
  // <details> nested inside a quote still counts toward MAX_DETAILS_DEPTH.
  function consumeBlockquoteOrCallout(lines, startIndex, depth) {
    const quoteLines = [];
    let i = startIndex;
    while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
      quoteLines.push(lines[i].replace(/^\s*>\s?/, ''));
      i++;
    }
    const firstLine = quoteLines[0] || '';
    const alertMatch = firstLine.match(/^\[!(WARNING|IMPORTANT|NOTE|CAUTION)\]\s*(.*)$/i);
    if (alertMatch) {
      const kind = alertMatch[1].toLowerCase();
      const titleText = alertMatch[1].toUpperCase();
      const inlineFirst = alertMatch[2].trim();
      const innerLines = (inlineFirst ? [inlineFirst, ''] : []).concat(quoteLines.slice(1));
      const bodyHtml = renderMarkdownSafe(innerLines.join('\n'), depth);
      return {
        html: `<div class="md-callout callout-${kind}"><div class="md-callout-title">${titleText}</div>${bodyHtml}</div>`,
        nextIndex: i
      };
    }
    const quoteHtml = renderMarkdownSafe(quoteLines.join('\n'), depth);
    return { html: `<blockquote>${quoteHtml}</blockquote>`, nextIndex: i };
  }

  function consumeListBlock(lines, startIndex, ordered) {
    const pattern = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
    const tag = ordered ? 'ol' : 'ul';
    const items = [];
    let i = startIndex;
    while (i < lines.length && pattern.test(lines[i])) {
      items.push(`<li>${renderInlineMarkdown(lines[i].replace(pattern, '').trim())}</li>`);
      i++;
    }
    return { html: `<${tag}>${items.join('')}</${tag}>`, nextIndex: i };
  }

  // <details> grammar: the open and close tags use bare lowercase <details> and <summary>
  // with no attributes (either on separate lines or compact <details><summary>...</summary>).
  // Every other form falls through to escaped paragraph text.
  const DETAILS_OPEN_RE = /^\s*<details>\s*$/;
  const DETAILS_CLOSE_RE = /^\s*<\/details>\s*$/;
  const DETAILS_SUMMARY_RE = /^\s*<summary>(.*)<\/summary>\s*$/;
  const COMPACT_DETAILS_PREFIX_RE = /^(\s*)<details>[ \t]*<summary>((?:(?!<\/summary>).)*)<\/summary>[ \t]*(.*)$/;
  const MAX_DETAILS_DEPTH = 3;

  function isCompactDetailsOpenLine(line) {
    return COMPACT_DETAILS_PREFIX_RE.test(line);
  }

  function isSingleLineCompactDetails(line) {
    const m = COMPACT_DETAILS_PREFIX_RE.exec(line);
    if (!m || m[3].includes('</summary>') || m[3].includes('<details>')) return false;
    return /^(.*?)[ \t]*<\/details>\s*$/.test(m[3]);
  }

  function expandSingleCompactDetailsLine(line) {
    const m = COMPACT_DETAILS_PREFIX_RE.exec(line);
    if (!m) return line;
    const indent = m[1];
    const summaryInner = m[2];
    const rest = m[3];
    // Keep extra </summary> tags on the summary line so DETAILS_SUMMARY_RE matches
    // greedily and escapes inner markup into summary text.
    if (rest.includes('</summary>')) {
      return `${indent}<details>\n${indent}<summary>${summaryInner}</summary>${rest}`;
    }
    const singleLineClose = !rest.includes('<details>') ? /^(.*?)[ \t]*<\/details>\s*$/.exec(rest) : null;
    if (singleLineClose) {
      const body = singleLineClose[1].trim();
      return body
        ? `${indent}<details>\n${indent}<summary>${summaryInner}</summary>\n${indent}${body}\n${indent}</details>`
        : `${indent}<details>\n${indent}<summary>${summaryInner}</summary>\n${indent}</details>`;
    }
    return rest
      ? `${indent}<details>\n${indent}<summary>${summaryInner}</summary>\n${indent}${rest}`
      : `${indent}<details>\n${indent}<summary>${summaryInner}</summary>`;
  }

  function normalizeCompactDetailsLines(text) {
    if (!text.includes('<details>')) return text;
    return text.split('\n').map(expandSingleCompactDetailsLine).join('\n');
  }

  function isParagraphBreakLine(lines, index) {
    const line = lines[index];
    const trimmed = line.trim();
    if (!trimmed) return true;
    if (/^\u0000(?:FENCE|MATH_BLOCK)_\d+\u0000$/.test(trimmed)) return true;
    if (/^(?:#{1,6}\s+|\s*>\s?|\s*[-*]\s+|\s*\d+\.\s+)/.test(line)) return true;
    if (DETAILS_OPEN_RE.test(line)) return true;
    return isTableHeaderAt(lines, index);
  }

  // Always consumes the start line, so a line that breaks paragraphs but did not
  // render as its own block (an unclosed or too-deep <details>) still shows as text.
  function consumeParagraphBlock(lines, startIndex) {
    const paraLines = [];
    let i = startIndex;
    do {
      paraLines.push(renderInlineMarkdown(lines[i].trim()));
      i++;
    } while (i < lines.length && !isParagraphBreakLine(lines, i));
    return {
      html: paraLines.length > 0 ? `<p>${paraLines.join('<br>')}</p>` : '',
      nextIndex: i
    };
  }

  // Returns the index of the </details> line that pairs with the open line at
  // startIndex, counting nested opens, or -1 when the block is never closed.
  function findDetailsClose(lines, startIndex) {
    let level = 0;
    for (let i = startIndex; i < lines.length; i++) {
      if (DETAILS_OPEN_RE.test(lines[i])) {
        level++;
      } else if (DETAILS_CLOSE_RE.test(lines[i])) {
        level--;
        if (level === 0) return i;
      }
    }
    return -1;
  }

  // Renders a <details> fold, or returns null when it is unclosed or nested deeper
  // than MAX_DETAILS_DEPTH. The emitted tags are fixed literals; only the summary
  // text (through renderInlineMarkdown) and the rendered body come from the input.
  function consumeDetailsBlock(lines, startIndex, codeBlocks, mathBlocks, depth) {
    if (depth >= MAX_DETAILS_DEPTH) return null;
    const closeIndex = findDetailsClose(lines, startIndex);
    if (closeIndex < 0) return null;
    let bodyStart = startIndex + 1;
    let label = 'Details';
    const summaryMatch = bodyStart < closeIndex ? lines[bodyStart].match(DETAILS_SUMMARY_RE) : null;
    if (summaryMatch) {
      label = summaryMatch[1].trim() || 'Details';
      bodyStart++;
    }
    const bodyHtml = renderMarkdownLines(lines.slice(bodyStart, closeIndex), codeBlocks, mathBlocks, depth + 1);
    return {
      html: `<details class="md-details"><summary>${renderInlineMarkdown(label)}</summary>${bodyHtml}</details>`,
      nextIndex: closeIndex + 1
    };
  }

  function consumeNextMarkdownBlock(lines, index, codeBlocks, mathBlocks, depth) {
    const line = lines[index];
    const trimmed = line.trim();
    if (!trimmed) return { html: '', nextIndex: index + 1 };
    const fenceMatch = trimmed.match(/^\u0000FENCE_(\d+)\u0000$/);
    if (fenceMatch) return { html: codeBlocks[Number(fenceMatch[1])] || '', nextIndex: index + 1 };
    const mathMatch = trimmed.match(/^\u0000MATH_BLOCK_(\d+)\u0000$/);
    if (mathMatch) return { html: mathBlocks[Number(mathMatch[1])] || '', nextIndex: index + 1 };
    if (DETAILS_OPEN_RE.test(line)) {
      const details = consumeDetailsBlock(lines, index, codeBlocks, mathBlocks, depth);
      if (details) return details;
      return consumeParagraphBlock(lines, index);
    }
    const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
    if (headingMatch) {
      const level = headingMatch[1].length;
      return { html: `<h${level}>${renderInlineMarkdown(headingMatch[2].trim())}</h${level}>`, nextIndex: index + 1 };
    }
    if (/^\s*>\s?/.test(line)) return consumeBlockquoteOrCallout(lines, index, depth);
    if (isTableHeaderAt(lines, index)) return renderTableBlock(lines, index);
    if (/^\s*[-*]\s+/.test(line)) return consumeListBlock(lines, index, false);
    if (/^\s*\d+\.\s+/.test(line)) return consumeListBlock(lines, index, true);
    return consumeParagraphBlock(lines, index);
  }

  // Renders already-extracted lines. Fold bodies recurse here with the parent's
  // codeBlocks and mathBlocks so fence and math placeholders inside a fold resolve.
  function renderMarkdownLines(lines, codeBlocks, mathBlocks, depth) {
    const htmlParts = [];
    let i = 0;
    while (i < lines.length) {
      const step = consumeNextMarkdownBlock(lines, i, codeBlocks, mathBlocks, depth);
      if (step.html) htmlParts.push(step.html);
      i = step.nextIndex > i ? step.nextIndex : i + 1;
    }
    return htmlParts.join('\n');
  }

  // Converts Markdown into safe HTML (supports fenced code blocks, Mermaid SVG,
  // LaTeX MathML, GFM pipe tables, GitHub alert callouts, <details> folds, headings,
  // lists, and paragraphs). Fences are extracted first, so a <details> line inside
  // a code block never opens a fold. depth is the number of enclosing folds.
  function renderMarkdownSafe(md, depth = 0) {
    if (!md) return '';
    const codeBlocks = [];
    const mathBlocks = [];
    const normalized = String(md).replace(/\r\n/g, '\n');
    const withoutFences = extractTopLevelFences(normalized, codeBlocks);
    const withoutDisplayMath = extractTopLevelDisplayMath(withoutFences, mathBlocks);
    const withNormalizedDetails = normalizeCompactDetailsLines(withoutDisplayMath);
    return renderMarkdownLines(withNormalizedDetails.split('\n'), codeBlocks, mathBlocks, depth);
  }
  // END SHARED_MARKDOWN_ENGINE

    function parseMarkdown(text) {
      return renderMarkdownSafe(text);
    }

    function renderReplyPreviewHtml(markdown) {
      const trimmed = String(markdown || '').trim();
      return trimmed ? renderMarkdownSafe(trimmed) : '<p class="preview-empty">Nothing to preview</p>';
    }

    function setReplyTabButtonState(btn, active) {
      if (!btn) return;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', active ? 'true' : 'false');
    }

    function currentReplyMarkdown(threadId, editor) {
      if (editor) return editor.value;
      return decisions[threadId] ? decisions[threadId].reply : '';
    }

    function switchReplyTab(threadId, mode) {
      const isPreview = mode === 'preview';
      replyTabs[threadId] = isPreview ? 'preview' : 'write';
      setReplyTabButtonState(document.getElementById(`reply-tab-write-${threadId}`), !isPreview);
      setReplyTabButtonState(document.getElementById(`reply-tab-preview-${threadId}`), isPreview);
      const editor = document.getElementById(`reply-text-${threadId}`);
      const preview = document.getElementById(`reply-preview-${threadId}`);
      if (editor) editor.style.display = isPreview ? 'none' : 'block';
      if (!preview) return;
      preview.style.display = isPreview ? 'block' : 'none';
      if (isPreview) {
        preview.innerHTML = renderReplyPreviewHtml(currentReplyMarkdown(threadId, editor));
      }
    }

    function refreshReplyPreviewIfActive(threadId) {
      if (replyTabs[threadId] !== 'preview') return;
      const preview = document.getElementById(`reply-preview-${threadId}`);
      if (preview && decisions[threadId]) {
        preview.innerHTML = renderReplyPreviewHtml(decisions[threadId].reply);
      }
    }

    async function copyToClipboard(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `
          <svg width="14" height="14" fill="#4caf50" viewBox="0 0 16 16">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
          </svg>
        `;
        btn.style.color = '#4caf50';
        setTimeout(() => {
          btn.innerHTML = originalHTML;
          btn.style.color = '';
        }, 1500);
      } catch (err) {
        console.error('Failed to copy text: ', err);
      }
    }

    let loadSeq = 0;

    async function loadComments() {
      const seq = ++loadSeq;
      try {
        const loaded = await dashboardHost.load();
        if (seq !== loadSeq) return;
        const terminalHtml = terminalOverlayHtml(loaded);
        if (terminalHtml) {
          showDoneOverlay(terminalHtml);
          return;
        }
        feedbackData = loaded;
        document.getElementById('repo-name').textContent = `${feedbackData.repo} (PR #${feedbackData.pr})`;

        document.getElementById('comments-count').textContent = (feedbackData.threads || []).length;
        document.getElementById('reviews-count').textContent = (feedbackData.reviews || []).length;
        document.getElementById('general-comments-count').textContent = (feedbackData.comments || []).length;
        document.getElementById('checks-count').textContent = (feedbackData.checks || []).length;
        document.getElementById('pending-count').textContent = (feedbackData.pendingChecks || []).length;

        if (feedbackData.gitState) {
          checkGitState(feedbackData.gitState);
        }
        for (const k of Object.keys(decisions)) {
          delete decisions[k];
        }
        for (const k of Object.keys(replyTabs)) {
          delete replyTabs[k];
        }
        renderThreads(feedbackData.threads);
        renderReviews(feedbackData.reviews);
        renderGeneralComments(feedbackData.comments);
        renderChecks(feedbackData.checks);
        renderPendingChecks(feedbackData.pendingChecks);
      } catch (err) {
        if (seq !== loadSeq) return;
        document.getElementById('content-comments').innerHTML = `
          <div class="empty-state" style="border-color: var(--danger-color); color: var(--danger-color);">
            Error loading feedback comments: ${err.message}
          </div>
        `;
      }
    }

    function resolveLocalStatusBadge(thread, decision) {
      const localStatus = thread.localStatus || '';
      if (localStatus.startsWith('Addressed')) {
        decision.approved = true;
        return '<span class="badge status-addressed">Addressed (Local)</span>';
      }
      if (localStatus.startsWith('Modified')) {
        decision.approved = true;
        return '<span class="badge status-modified">Modified Locally</span>';
      }
      return '<span class="badge">Unaddressed</span>';
    }

    function renderThreadStatusBadgesHtml(thread, decision) {
      const localStatusBadge = resolveLocalStatusBadge(thread, decision);
      const outdatedBadge = thread.isOutdated ? '<span class="badge outdated">Outdated (Pushed)</span>' : '';
      const resolvedBadge = thread.isResolved ? '<span class="badge status-addressed">Resolved (GitHub)</span>' : '';
      const hiddenBadge = thread.isHidden ? '<span class="badge outdated">Hidden/Minimized</span>' : '';
      return `${assessmentBadgeHtml(decision.rating)}${localStatusBadge}${outdatedBadge}${resolvedBadge}${hiddenBadge}`;
    }

    function renderThreadCommentsHtml(comments) {
      return (comments || []).map(c => `
        <div class="comment-bubble">
          <div class="comment-meta">
            <span class="comment-author">@${c.author || 'unknown'}</span>
            <span>${c.createdAt ? new Date(c.createdAt).toLocaleString() : ''}</span>
          </div>
          <div class="comment-content markdown-rendered">${parseMarkdown(c.body || '')}</div>
        </div>
      `).join('');
    }

    function renderSuggestionHtml(thread) {
      if (!thread.suggestion) return '';
      const normalized = String(thread.suggestion).replace(/\r\n/g, '\n');
      return `
        <div class="suggestion-block">
          <div class="suggestion-header">
            <span>SUGGESTED CHANGE</span>
          </div>
          <pre class="suggestion-code"><code>${escapeHtml(normalized)}</code></pre>
        </div>
      `;
    }

    function renderProposedFixHtml(thread) {
      if (!thread.proposedFix) return '';
      return `
        <div class="proposed-fix-block" style="background-color: rgba(0, 122, 204, 0.05); border: 1px solid rgba(0, 122, 204, 0.2); border-radius: 4px; padding: 12px; margin: 12px 0;">
          <strong style="color: #9cdcfe;">Proposed Fix:</strong>
          <div class="comment-content markdown-rendered" style="margin-top: 6px; font-size: 0.9rem;">${parseMarkdown(thread.proposedFix)}</div>
        </div>
      `;
    }

    function findMatchingSnippetLine(codeBlock, line, originalLine) {
      const hasLine = ln => Number.isInteger(ln) && codeBlock.some(item => item.line === ln);
      if (hasLine(line)) return line;
      if (hasLine(originalLine)) return originalLine;
      return null;
    }

    function renderCodeSnippetLineHtml(lineObj, matchLine) {
      const lineNum = Number.isInteger(lineObj.line) ? lineObj.line : null;
      const isTarget = matchLine !== null && lineNum === matchLine;
      const targetClass = isTarget ? ' target-line' : '';
      const targetAttr = isTarget ? ' data-target-line="true"' : '';
      return `
        <div class="code-snippet-line${targetClass}"${targetAttr}>
          <div class="code-snippet-number">${lineNum !== null ? lineNum : ''}</div>
          <div class="code-snippet-content">${escapeHtml(lineObj.content)}</div>
        </div>
      `;
    }

    function renderCodeBlockHtml(thread) {
      const block = thread.rightRefCodeBlock;
      if (!block || block.length === 0) return '';
      const matchLine = findMatchingSnippetLine(block, thread.line, thread.originalLine);
      const linesHtml = block.map(line => renderCodeSnippetLineHtml(line, matchLine)).join('');
      const totalLines = block.length;
      const lineCountLabel = `${totalLines} ${totalLines === 1 ? 'line' : 'lines'}`;
      return `
        <div class="code-snippet-box">
          <div class="code-snippet-header">
            <span>ORIGINAL CODE CONTEXT</span>
            <span class="code-snippet-meta">${lineCountLabel}</span>
          </div>
          <div class="code-snippet-scroll">
            <div class="code-snippet-lines">
              ${linesHtml}
            </div>
          </div>
        </div>
      `;
    }

    function renderThreadHeaderHtml(thread, badgesHtml) {
      const lineRef = thread.line || thread.originalLine;
      const displaySuffix = lineRef ? `:${lineRef}` : ' (File)';
      const copySuffix = lineRef ? `:${lineRef}` : '';
      return `
        <div class="thread-header">
          <div style="display: flex; align-items: center; gap: 4px;">
            <span class="file-path">${thread.path}${displaySuffix}</span>
            <button class="copy-btn" onclick="copyToClipboard('${thread.path}${copySuffix}', this)" title="Copy file path and line number">
              <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
                <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
              </svg>
            </button>
          </div>
          <div class="status-badge-container">
            ${badgesHtml}
          </div>
        </div>
      `;
    }

    function renderThreadActionPanelHtml(thread, d) {
      const approvedClass = d.approved ? 'approved' : '';
      const approvedBg = d.approved ? '#10b981' : '#3b82f6';
      const approvedIcon = d.approved ? '☑' : '☐';
      const approvedText = d.approved ? 'Action Approved' : 'Approve Action';
      return `
        <div class="action-panel">
          <div class="action-row">
            <span style="font-size: 0.85rem; color: var(--text-light); font-weight:600;">DECISION:</span>
            <label class="action-option">
              <input type="radio" name="action-${thread.id}" value="accept" ${d.action === 'accept' ? 'checked' : ''} onchange="updateAction('${thread.id}', 'accept')">
              Accept Fix
            </label>
            <label class="action-option">
              <input type="radio" name="action-${thread.id}" value="clarify" ${d.action === 'clarify' ? 'checked' : ''} onchange="updateAction('${thread.id}', 'clarify')">
              Request Clarification
            </label>
            <label class="action-option">
              <input type="radio" name="action-${thread.id}" value="decline" ${d.action === 'decline' ? 'checked' : ''} onchange="updateAction('${thread.id}', 'decline')">
              Decline/Ignore
            </label>
          </div>

          <div class="reply-box">
            <label for="reply-text-${thread.id}">Draft Reply Comment:</label>
            <div class="comment-box" id="reply-box-${thread.id}">
              <div class="comment-tabs-header">
                <div class="comment-tabs" role="tablist" aria-label="Draft reply view mode">
                  <button type="button" id="reply-tab-write-${thread.id}" class="comment-tab active" role="tab" aria-selected="true" onclick="switchReplyTab('${thread.id}', 'write')">Write</button>
                  <button type="button" id="reply-tab-preview-${thread.id}" class="comment-tab" role="tab" aria-selected="false" onclick="switchReplyTab('${thread.id}', 'preview')">Preview</button>
                </div>
              </div>
              <textarea id="reply-text-${thread.id}" class="reply-textarea" rows="4" oninput="updateReply('${thread.id}', this.value)">${escapeHtml(d.reply)}</textarea>
              <div id="reply-preview-${thread.id}" class="markdown-rendered comment-preview" style="display: none;"></div>
            </div>
          </div>

          <div class="reply-box" style="margin-top: 12px;">
            <label for="instructions-${thread.id}">Instructions for Agent (adjust plan):</label>
            <textarea id="instructions-${thread.id}" class="reply-textarea" rows="4" oninput="updateInstructions('${thread.id}', this.value)" placeholder="e.g., Use helper function X instead, or skip this..."></textarea>
          </div>

          <div class="checkbox-row" style="align-items: center;">
            <button
              type="button"
              id="approve-btn-${thread.id}"
              class="approve-action-btn ${approvedClass}"
              onclick="toggleApproval('${thread.id}')"
              style="
                background-color: ${approvedBg};
              "
            >
              <span id="approve-icon-${thread.id}" style="font-size: 1.1rem; display: flex; align-items: center;">
                ${approvedIcon}
              </span>
              <span id="approve-text-${thread.id}">
                ${approvedText}
              </span>
            </button>
            <label class="checkbox-option" style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-light);">
              <input type="checkbox" id="resolve-${thread.id}" ${d.resolve ? 'checked' : ''} onchange="updateResolve('${thread.id}', this.checked)" style="cursor: pointer;">
              Mark thread resolved
            </label>
          </div>
        </div>
      `;
    }

    function createThreadCard(thread) {
      // Seed decision state from the proposal fields merged by the server.
      decisions[thread.id] = initialDecision(thread);
      replyTabs[thread.id] = 'write';
      const d = decisions[thread.id];
      const badgesHtml = renderThreadStatusBadgesHtml(thread, d);

      const card = document.createElement('div');
      card.className = 'thread-card';
      card.id = `card-${thread.id}`;
      card.innerHTML = `
        ${renderThreadHeaderHtml(thread, badgesHtml)}
        <div class="thread-body">
          ${renderCodeBlockHtml(thread)}
          <div class="comments-history">
            ${renderThreadCommentsHtml(thread.comments)}
          </div>
          ${renderSuggestionHtml(thread)}
          ${renderProposedFixHtml(thread)}
          ${renderThreadActionPanelHtml(thread, d)}
        </div>
      `;
      return card;
    }

    function renderThreads(threads) {
      const container = document.getElementById('content-comments');
      if (!threads || threads.length === 0) {
        container.innerHTML = '<div class="empty-state">No active or unresolved review comments found on this PR.</div>';
        return;
      }

      container.innerHTML = '';
      threads.forEach(thread => {
        container.appendChild(createThreadCard(thread));
      });

      scrollCodeSnippetsToTarget(container);
      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => scrollCodeSnippetsToTarget(container));
      }
    }

    function scrollCodeSnippetsToTarget(root) {
      if (!root) return;
      root.querySelectorAll('.code-snippet-scroll').forEach(scrollEl => {
        if (scrollEl.dataset.scrolled === 'true') return;
        if (scrollEl.clientHeight === 0) return;
        if (scrollEl.scrollHeight > scrollEl.clientHeight) {
          const targetRow = scrollEl.querySelector('[data-target-line="true"]');
          if (targetRow) {
            const scrollRect = scrollEl.getBoundingClientRect();
            const rowRect = targetRow.getBoundingClientRect();
            const rowBottomInScroll = (rowRect.bottom - scrollRect.top) + scrollEl.scrollTop;
            scrollEl.scrollTop = Math.max(0, rowBottomInScroll - scrollEl.clientHeight + 16);
          } else {
            scrollEl.scrollTop = scrollEl.scrollHeight;
          }
        }
        scrollEl.dataset.scrolled = 'true';
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function updateAction(threadId, action) {
      decisions[threadId].action = action;
      const replyArea = document.getElementById(`reply-text-${threadId}`);

      // Only replace the reply when it is still one of our own templates (or
      // empty). Agent-drafted replies and user edits are left alone.
      if (replyArea && isStockReply(replyArea.value)) {
        const thread = feedbackData.threads.find(t => t.id === threadId);
        decisions[threadId].reply = stockReplyFor(thread, action);
        replyArea.value = decisions[threadId].reply;
        refreshReplyPreviewIfActive(threadId);
      }

      if (action === 'clarify') {
        decisions[threadId].resolve = false; // default false for clarification
        const resolveEl = document.getElementById(`resolve-${threadId}`);
        if (resolveEl) resolveEl.checked = false;
      }
    }

    function updateReply(threadId, val) {
      decisions[threadId].reply = val;
    }

    function updateApproval(threadId, val) {
      decisions[threadId].approved = val;
      const card = document.getElementById(`card-${threadId}`);
      if (val) {
        card.style.borderColor = 'rgba(76, 175, 80, 0.4)';
      } else {
        card.style.borderColor = 'var(--border-color)';
      }
    }

    function toggleApproval(threadId) {
      const isApproved = !decisions[threadId].approved;

      const btn = document.getElementById(`approve-btn-${threadId}`);
      const icon = document.getElementById(`approve-icon-${threadId}`);
      const text = document.getElementById(`approve-text-${threadId}`);

      if (isApproved) {
        btn.classList.add("approved");
        btn.style.backgroundColor = "#10b981"; // Green
        icon.textContent = "☑";
        text.textContent = "Action Approved";
      } else {
        btn.classList.remove("approved");
        btn.style.backgroundColor = "#3b82f6"; // Blue
        icon.textContent = "☐";
        text.textContent = "Approve Action";
      }

      updateApproval(threadId, isApproved);
    }

    const SUMMARY_ACTION_LABELS = {
      accept: "Accept proposed fix",
      clarify: "Request clarification",
      decline: "Decline/Ignore comment"
    };

    function getSummaryThreadDetails(id) {
      const threads = (feedbackData && feedbackData.threads) || [];
      const thread = threads.find(t => t.id === id);
      if (!thread) return { path: "Unknown File", line: "", comment: "" };
      const comments = thread.comments || [];
      const firstComment = comments.length > 0 ? (comments[0].body || "") : "";
      const commentSnippet = firstComment.length > 120 ? firstComment.substring(0, 120) + "..." : firstComment;
      return {
        path: thread.path,
        line: thread.line || thread.originalLine,
        comment: commentSnippet
      };
    }

    function renderSummaryNoteLineHtml(label, value, borderColor, textColor) {
      if (!value) return '';
      return `
        <div style="
          background-color: #0f1115;
          border-radius: 4px;
          padding: 0.5rem 0.75rem;
          font-size: 0.8rem;
          color: ${textColor};
          margin-top: 0.25rem;
          border-left: 2px solid ${borderColor};
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        ">
          <strong>${label}:</strong> "${escapeHtml(value)}"
        </div>
      `;
    }

    function renderApprovedSummaryCardHtml(d) {
      const details = getSummaryThreadDetails(d.threadId);
      const actionText = SUMMARY_ACTION_LABELS[d.action] || d.action;
      return `
        <div style="
          background-color: #1a1e26;
          border: 1px solid #2d3340;
          border-radius: 8px;
          padding: 1rem;
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          text-align: left;
        ">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
            <h4 style="font-size: 0.925rem; font-weight: 600; color: #f3f4f6; margin: 0;">
              ${details.path}${details.line ? ':' + details.line : ''}
            </h4>
            <span style="background-color: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); padding: 0.15rem 0.4rem; border-radius: 4px; color: #34d399; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;">
              Approved
            </span>
          </div>
          <p style="font-size: 0.825rem; color: #9ca3af; margin: 0; font-style: italic; line-height: 1.4;">
            "${escapeHtml(details.comment)}"
          </p>
          <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; font-size: 0.75rem; margin-top: 0.25rem;">
            <span style="background-color: #252a36; border: 1px solid #383f52; padding: 0.15rem 0.4rem; border-radius: 4px; color: #9ca3af;">
              Action: <strong>${actionText}</strong>
            </span>
            <span style="background-color: #252a36; border: 1px solid #383f52; padding: 0.15rem 0.4rem; border-radius: 4px; color: #9ca3af;">
              Assessment: <strong>${RATING_LABELS[d.rating]}</strong>
            </span>
            <span style="background-color: #252a36; border: 1px solid #383f52; padding: 0.15rem 0.4rem; border-radius: 4px; color: #9ca3af;">
              Resolve Thread: <strong>${d.resolve ? 'Yes' : 'No'}</strong>
            </span>
          </div>
          ${renderSummaryNoteLineHtml('Draft Reply', d.reply, '#3b82f6', '#9ca3af')}
          ${renderSummaryNoteLineHtml('Agent Instructions', d.agentInstructions, '#6366f1', '#a5b4fc')}
        </div>
      `;
    }

    function renderUnapprovedSummaryCardHtml(d) {
      const details = getSummaryThreadDetails(d.threadId);
      return `
        <div style="
          background-color: #1a1e26;
          border: 1px solid #2d3340;
          border-radius: 8px;
          padding: 0.85rem 1rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 1rem;
          text-align: left;
        ">
          <h4 style="font-size: 0.9rem; font-weight: 500; color: #9ca3af; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;">
            ${details.path}${details.line ? ':' + details.line : ''}
          </h4>
          <span style="
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background-color: #2d3340;
            color: #9ca3af;
            text-transform: uppercase;
          ">Not Approved</span>
        </div>
      `;
    }

    function renderSummaryPage(decisionList) {
      const approved = decisionList.filter(d => d.approved);
      const unapproved = decisionList.filter(d => !d.approved);
      const approvedCardsHtml = approved.length > 0
        ? approved.map(renderApprovedSummaryCardHtml).join("")
        : `<p style="font-size: 0.875rem; color: #6b7280; font-style: italic; text-align: left;">No feedback actions were approved in this session.</p>`;
      const unapprovedCardsHtml = unapproved.length > 0
        ? unapproved.map(renderUnapprovedSummaryCardHtml).join("")
        : `<p style="font-size: 0.875rem; color: #6b7280; font-style: italic; text-align: left;">All feedback actions were approved.</p>`;

      const closeTarget = dashboardHost.kind === 'mcp-app' ? 'pane' : 'tab';
      const closeCopy = `You can close this ${closeTarget} now. The agent is resuming in the background to apply the approved changes. A summary is shown below.`;
      showDoneOverlay(submittedOverlayHtml(closeCopy, `
          <!-- Summary Content Grid -->
          <div style="width: 100%; max-width: 48rem; display: flex; flex-direction: column; gap: 2.5rem;">

            <!-- Section 1: Approved Actions -->
            <div>
              <h3 style="font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #60a5fa; border-bottom: 1px solid #2d3340; padding-bottom: 0.5rem; margin: 0 0 1rem 0; display: flex; justify-content: space-between; align-items: center;">
                <span>Approved Actions</span>
                <span style="font-size: 0.8rem; background-color: rgba(59, 130, 246, 0.15); padding: 0.1rem 0.5rem; border-radius: 12px; color: #93c5fd;">${approved.length}</span>
              </h3>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${approvedCardsHtml}
              </div>
            </div>

            <!-- Section 2: Not Approved -->
            <div>
              <h3 style="font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; border-bottom: 1px solid #2d3340; padding-bottom: 0.5rem; margin: 0 0 1rem 0; display: flex; justify-content: space-between; align-items: center;">
                <span>Actions Not Approved</span>
                <span style="font-size: 0.8rem; background-color: rgba(156, 163, 175, 0.15); padding: 0.1rem 0.5rem; border-radius: 12px; color: #d1d5db;">${unapproved.length}</span>
              </h3>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                ${unapprovedCardsHtml}
              </div>
            </div>

          </div>
      `));
    }

    function updateResolve(threadId, val) {
      decisions[threadId].resolve = val;
    }

    function updateInstructions(threadId, val) {
      decisions[threadId].agentInstructions = val;
    }

    document.getElementById('save-all').addEventListener('click', async () => {
      const list = Object.keys(decisions).map(id => ({
        threadId: id,
        ...decisions[id]
      }));

      try {
        await dashboardHost.save({
          repo: feedbackData.repo,
          pr: feedbackData.pr,
          decisions: list
        });

        renderSummaryPage(list);
      } catch (err) {
        showNotice('Error saving plan: ' + err.message);
      }
    });

    /**
     * Shows a transient message at the bottom of the page.
     *
     * Used instead of `alert()`, which the sandboxed MCP App iframe ignores.
     */
    let noticeTimer = null;
    function showNotice(message) {
      let notice = document.getElementById('dashboard-notice');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'dashboard-notice';
        notice.className = 'dashboard-notice';
        notice.setAttribute('role', 'alert');
        document.body.appendChild(notice);
      }
      notice.textContent = message;
      notice.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 6000);
    }

    /**
     * Returns true on the second click of `btn` within `windowMs`.
     *
     * The first click relabels the button with `armedLabel` and returns false.
     * Used instead of `confirm()`, which returns false without showing a
     * dialog in the sandboxed MCP App iframe.
     */
    function confirmByDoubleClick(btn, armedLabel, windowMs = 4000) {
      if (btn.dataset.armed === 'true') {
        clearTimeout(Number(btn.dataset.armTimer));
        delete btn.dataset.armed;
        btn.classList.remove('armed');
        btn.textContent = btn.dataset.idleLabel;
        return true;
      }
      btn.dataset.idleLabel = btn.textContent.trim();
      btn.dataset.armed = 'true';
      btn.classList.add('armed');
      btn.textContent = armedLabel;
      btn.dataset.armTimer = String(setTimeout(() => {
        delete btn.dataset.armed;
        btn.classList.remove('armed');
        btn.textContent = btn.dataset.idleLabel;
      }, windowMs));
      return false;
    }

    document.getElementById('abort-btn').addEventListener('click', async (event) => {
      if (!confirmByDoubleClick(event.currentTarget, 'Click again to abort')) return;
      try {
        await dashboardHost.abort();
        const closeTarget = dashboardHost.kind === 'mcp-app' ? 'pane' : 'tab';
        showDoneOverlay(abortedOverlayHtml(
          `You can close this ${closeTarget} now. The agent has been notified.`
        ));
      } catch (err) {
        showNotice('Error aborting: ' + err.message);
      }
    });

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active');
      });

      document.getElementById(`tab-${tabName}`).classList.add('active');
      const activeContent = document.getElementById(`content-${tabName}`);
      activeContent.classList.add('active');
      if (tabName === 'comments') {
        scrollCodeSnippetsToTarget(activeContent);
      }
    }

    function collectGitRepoWarnings(gitState) {
      if (!gitState.isGit) {
        return {
          warnings: [`<strong>Error:</strong> ${gitState.error || 'Project directory is not a git repository.'}`],
          blockSave: true
        };
      }
      const warnings = [];
      let blockSave = false;
      if (gitState.expectedRepo && !gitState.isCorrectRepo) {
        warnings.push(`<strong>Repository Mismatch:</strong> Expected repository <code>${gitState.expectedRepo}</code>, but local remote points to <code>${gitState.activeRepo || 'none'}</code>.`);
        blockSave = true;
      }
      if (gitState.expectedBranch && !gitState.isCorrectBranch) {
        const prNum = feedbackData ? feedbackData.pr : '';
        warnings.push(`<strong>Branch Warning:</strong> Active branch is <code>${gitState.activeBranch}</code>, expected <code>${gitState.expectedBranch}</code>. Run <code>gh pr checkout ${prNum}</code> if needed.`);
      }
      if (gitState.isDirty) {
        warnings.push('<strong>Dirty Workspace:</strong> Local repository has uncommitted changes. Ensure active changes do not conflict with review plan.');
      }
      if (gitState.hasUnpushed) {
        const count = gitState.unpushedCommits.length;
        warnings.push(`<strong>Unpushed Commits:</strong> There are ${count} unpushed commits.`);
      }
      return { warnings, blockSave };
    }

    function applySaveButtonLockState(saveBtn, blockSave) {
      saveBtn.disabled = blockSave;
      saveBtn.style.opacity = blockSave ? '0.5' : '1.0';
      saveBtn.style.cursor = blockSave ? 'not-allowed' : 'pointer';
      saveBtn.title = blockSave
        ? "Save & Apply is disabled because git state is out of sync. Resolve warnings to enable."
        : "";
    }

    function checkGitState(gitState) {
      const banner = document.getElementById('warning-banner');
      const saveBtn = document.getElementById('save-all');

      if (!gitState) {
        banner.style.display = 'none';
        return;
      }

      const { warnings, blockSave } = collectGitRepoWarnings(gitState);

      if (warnings.length > 0) {
        banner.innerHTML = '<ul style="margin: 0; padding-left: 20px; font-family: inherit;">' + warnings.map(w => `<li style="margin-bottom: 4px;">${w}</li>`).join('') + '</ul>';
        banner.style.display = 'block';
      } else {
        banner.style.display = 'none';
      }

      applySaveButtonLockState(saveBtn, blockSave);
    }

    function renderReviews(reviews) {
      const container = document.getElementById('content-reviews');
      if (!reviews || reviews.length === 0) {
        container.innerHTML = '<div class="empty-state">No top-level submitted reviews found.</div>';
        return;
      }
      container.innerHTML = '';
      reviews.forEach(r => {
        const card = document.createElement('div');
        card.className = 'check-card';
        const stateColor = r.state === 'APPROVED' ? 'var(--success-color)' : (r.state === 'CHANGES_REQUESTED' ? 'var(--danger-color)' : 'var(--warning-color)');
        card.innerHTML = `
          <div class="check-header">
            <span style="font-weight: 600; color: ${stateColor};">
              @${escapeHtml(r.author || 'ghost')}
            </span>
            <span class="badge" style="background-color: ${stateColor}; color: white; text-transform: uppercase;">${escapeHtml(r.state || 'COMMENTED')}</span>
          </div>
          <div class="check-body">
            <div class="comment-content markdown-rendered">${parseMarkdown(r.body || 'No summary comment provided.')}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderGeneralComments(comments) {
      const container = document.getElementById('content-general');
      if (!comments || comments.length === 0) {
        container.innerHTML = '<div class="empty-state">No conversation timeline comments found.</div>';
        return;
      }
      container.innerHTML = '';
      comments.forEach(c => {
        const card = document.createElement('div');
        card.className = 'check-card';
        card.innerHTML = `
          <div class="check-header">
            <span style="font-weight: 600; color: #9cdcfe;">@${escapeHtml(c.author || 'ghost')}</span>
            <span style="font-size: 0.8rem; color: var(--text-light);">${c.createdAt ? new Date(c.createdAt).toLocaleString() : ''}</span>
          </div>
          <div class="check-body">
            <div class="comment-content markdown-rendered">${parseMarkdown(c.body || '')}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderPendingChecks(pending) {
      const container = document.getElementById('content-pending');
      if (!pending || pending.length === 0) {
        container.innerHTML = '<div class="empty-state">No active or pending checks running.</div>';
        return;
      }
      container.innerHTML = '';
      pending.forEach(p => {
        const card = document.createElement('div');
        card.className = 'check-card';
        card.innerHTML = `
          <div class="check-header">
            <span style="font-weight: 600; color: var(--warning-color); display: flex; align-items: center; gap: 8px;">
              ⏳ ${escapeHtml(p.name || 'Check')}
            </span>
            <span class="badge" style="background-color: var(--warning-color); color: black; text-transform: uppercase;">${escapeHtml(p.state || 'PENDING')}</span>
          </div>
          <div class="check-body">
            <div style="font-size: 0.9rem; color: var(--text-light);">
              <strong>Workflow:</strong> ${escapeHtml(p.workflow || 'N/A')} | 
              <strong>Link:</strong> <a href="${escapeHtml(p.link)}" target="_blank" style="color: #9cdcfe; text-decoration: none;">View Run on GitHub</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderChecks(checks) {
      const container = document.getElementById('content-checks');
      if (!checks || checks.length === 0) {
        container.innerHTML = '<div class="empty-state">All checks passing! ✅</div>';
        return;
      }

      container.innerHTML = '';

      checks.forEach(check => {
        const card = document.createElement('div');
        card.className = 'check-card';

        let annotationsHtml = '';
        if (check.annotations && check.annotations.length > 0) {
          const annItems = check.annotations.map(a => `<li>${escapeHtml(a)}</li>`).join('');
          annotationsHtml = `
            <div style="background-color: rgba(244, 67, 54, 0.08); border: 1px solid rgba(244, 67, 54, 0.3); border-radius: 4px; padding: 12px; margin-bottom: 12px;">
              <strong style="color: #ff8888;">Annotations (${check.annotations.length}):</strong>
              <ul style="margin: 6px 0 0 0; padding-left: 20px; font-size: 0.85rem; font-family: monospace;">
                ${annItems}
              </ul>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="check-header">
            <span class="check-name">
              <svg width="16" height="16" fill="currentColor" style="color: var(--danger-color);" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
              </svg>
              ${escapeHtml(check.name)}
            </span>
            <span class="badge outdated" style="text-transform: uppercase;">${escapeHtml(check.state)}</span>
          </div>
          <div class="check-body">
            <div style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-light);">
              <strong>Workflow:</strong> ${escapeHtml(check.workflow || 'N/A')} | 
              <strong>Link:</strong> <a href="${escapeHtml(check.link)}" target="_blank" style="color: #9cdcfe; text-decoration: none;">View on GitHub</a>
            </div>
            ${annotationsHtml}
            <pre class="check-logs"><code>${escapeHtml(check.logs || 'No logs available.')}</code></pre>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.__dashboardReload = () => {
        const done = document.getElementById('dashboard-done');
        if (done) done.remove();
        loadComments();
      };
      loadComments();
      if (typeof dashboardHost.subscribeGitState === 'function') {
        dashboardHost.subscribeGitState((gitState) => {
          checkGitState(gitState);
        });
      }
    });
  </script>
</body>
</html>
